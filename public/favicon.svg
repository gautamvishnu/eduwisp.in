<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f0e2a"/>
    </radialGradient>
    <radialGradient id="glowCenter" cx="50%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wispLeft" x1="0%" y1="100%" x2="30%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="wispMid" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="wispRight" x1="100%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="18" fill="url(#bg)"/>

  <!-- Inner ambient glow -->
  <ellipse cx="50" cy="68" rx="28" ry="16" fill="url(#glowCenter)"/>

  <!-- Left wisp flame -->
  <path d="M 22 76 C 20 66 17 54 24 42 C 27 35 28 27 25 19 C 31 28 34 38 30 50 C 28 58 30 66 29 74 Z"
        fill="url(#wispLeft)" filter="url(#glow)" opacity="0.95"/>

  <!-- Middle wisp flame (tallest) -->
  <path d="M 44 76 C 42 63 39 50 46 36 C 49 27 51 17 49 10 C 55 21 57 34 52 47 C 49 58 52 67 51 76 Z"
        fill="url(#wispMid)" filter="url(#glow)" opacity="0.98"/>

  <!-- Right wisp flame -->
  <path d="M 70 76 C 72 65 75 53 69 41 C 66 33 66 25 70 18 C 66 27 62 38 66 51 C 68 60 68 68 69 76 Z"
        fill="url(#wispRight)" filter="url(#glow)" opacity="0.95"/>

  <!-- Base glow -->
  <ellipse cx="50" cy="75" rx="24" ry="3.5" fill="#8b5cf6" opacity="0.55" filter="url(#glow)"/>

  <!-- Highlight edges -->
  <path d="M 25 73 C 27 63 28 51 27 43" stroke="#e9d5ff" stroke-width="0.7" fill="none" opacity="0.55"/>
  <path d="M 50 74 C 51 61 51 47 51 37" stroke="#f5f3ff" stroke-width="0.7" fill="none" opacity="0.65"/>
  <path d="M 69 73 C 69 63 67 53 69 44" stroke="#e9d5ff" stroke-width="0.7" fill="none" opacity="0.55"/>
</svg>
